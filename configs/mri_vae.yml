seed: 42

output_dir: outputs/vae_ablation

data:
  root: /media/25880586@su/D512/data/gbm
  cached_train_dir: "/media/25880586@su/D512/med-diffusion-project/data/vae_latents_mm/train"
  cached_val_dir: "/media/25880586@su/D512/med-diffusion-project/data/vae_latents_mm/val"
  modalities:
    - t1
    - t1gd
    - t2
    - flair
  require_all_modalities: True
  split_file: /media/25880586@su/D512/data/gbm/splits/multimodal_seed42.json
  control_fraction: 0.25
  image_size: 256
  slice_axis: 2
  val_fraction: 0.1
  test_fraction: 0.1
  min_foreground_fraction: 0.01
  lower_percentile: 0.5
  upper_percentile: 99.5

vae:
  in_channels: 1
  out_channels: 1
  base_channels: 64
  channel_mults: [1, 2, 4, 4]
  latent_channels: 16
  num_res_blocks: 2
  num_res_blocks_decoder: 3
  norm_groups: 32
  dropout: 0.0
  use_checkpoint: false

vae_loss:
  reconstruction_weight: 1.0
  kl_weight: 1.0e-6
  perceptual_weight: 0.0

training:
  epochs: 15
  batch_size: 32
  num_workers: 8
  learning_rate: 1.0e-4
  weight_decay: 1.0e-4
  mixed_precision: true
  prefetch_factor: 4
  mp_dtype: bf16