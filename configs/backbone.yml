seed: 42

data:
  root: /media/25880586@su/D512/data/gbm
  cached_train_dir: /media/25880586@su/D512/vae_latents_mm_backbone_v2/train
  cached_val_dir: /media/25880586@su/D512/vae_latents_mm_backbone_v2/val
  modalities:
    - t1
    - t1gd
    - t2
    - flair
  require_all_modalities: True
  split_file: /media/25880586@su/D512/data/gbm/splits/multimodal_seed42.json
  control_fraction: 0.25
  image_size: 256
  slice_axis: 2
  val_fraction: 0.1
  test_fraction: 0.1
  min_foreground_fraction: 0.01
  lower_percentile: 0.5
  upper_percentile: 99.5

vae:
  in_channels: 1
  out_channels: 1
  base_channels: 64
  channel_mults: [1, 2, 4, 4]
  latent_channels: 16
  num_res_blocks: 2
  num_res_blocks_decoder: 3
  norm_groups: 32
  dropout: 0.0
  use_checkpoint: false

vae_loss:
  reconstruction_weight: 1.0
  kl_weight: 1.0e-6
  perceptual_weight: 0.0

diffusion:
  architecture: latent_v2
  num_modalities: 4
  base_channels: 192
  time_dim: 512
  norm_groups: 32
  dropout: 0.0
  guidance_scale: 1.0
  num_timesteps: 1000
  beta_start: 0.0001
  beta_end: 0.02

training:
  num_epochs: 200
  batch_size: 64
  num_workers: 6
  learning_rate: 2.5e-5
  fine_tuning_learning_rate: 5.0e-6
  weight_decay: 0.0001
  mixed_precision: true
  latent_scale_batches: 100
  amp_dtype: bf16
  compile: true
  compile_mode: "reduce-overhead"
  seed: 42
  output_dir: outputs/diffusion_am_deeper

evaluation:
  modalities:
    - t1
    - t1gd
    - t2
    - flair
  guidance_scale: 1.5
  sample_every: 1
  fid_every: 500
  fid_samples: 256
  generation_batch_size: 16
  batch_size: 16
  fid_feature: 2048
  seed: 1234
  validation_loss_seed: 4321

ema:
  enabled: true
  decay: 0.9999